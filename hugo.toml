baseURL = "https://jdreben.github.io/jdreben/"
languageCode = "en-us"
title = "James Dreben"
theme = "james"
[pagination]
  pagerSize = 10
enableRobotsTXT = true
enableGitInfo = true
copyright = "James Dreben"

[params]
  author      = "James Dreben"
  description = "Software engineer in San Juan, PR with experience across AI, SRE, and full-stack web development."
  tagline     = "Harvard CS grad · Founder/CTO turned engineer · San Juan, PR"
  location    = "San Juan, Puerto Rico"
  github      = "https://github.com/jdreben"
  mastodon    = "https://mastodon.world/@Jdreben"
  bluesky     = "https://bsky.app/profile/jdreben.omg.lol"
  linkedin    = "https://www.linkedin.com/in/jamesdreben/"
  homepage    = "https://jdreben.omg.lol"

  # IndieWeb endpoints. Leave blank to disable.
  # Webmention: sign up at https://webmention.io/, get the endpoints, and paste here.
  webmention_url = ""
  pingback_url   = ""

[taxonomies]
  tag = "tags"

[menu]
  [[menu.main]]
    name   = "Writing"
    url    = "/posts/"
    weight = 1
  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 2

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style              = "dracula"
    lineNos            = false
    noClasses          = true
    guessSyntax        = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
